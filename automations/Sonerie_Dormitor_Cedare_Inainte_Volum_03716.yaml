alias: Sonerie dormitor
description: 'Dupa patru double click-uri consecutive reda sunetul Welcome 10 pe hubul .222. Secventa
  incompleta nu modifica volumul. Dupa cedarea iesirii audio de catre muzica, aplica numai WAV-ului volumul
  temporar 10% intre 21:00 si 09:00, respectiv 50% in restul zilei. Integrarea restabileste volumul curent
  al muzicii inainte de reluare. Memoreaza starea ring light-ului, culoarea RGB si luminozitatea. Executa
  secventa rosu-albastru-rosu-albastru, apoi restaureaza lumina. Necesita integrarea 0.37.16 sau mai noua.
  Ultima modificare: 15.10.2026, ora 00:57.'
triggers:
- trigger: mqtt
  topic: zigbee2mqtt/Buton de sonerie/action
  payload: double
conditions: []
actions:
- repeat:
    count: 3
    sequence:
    - wait_for_trigger:
      - trigger: mqtt
        topic: zigbee2mqtt/Buton de sonerie/action
        payload: double
      timeout: 00:00:01
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - stop: Secventa de patru double click-uri nu a fost completata
- variables:
    ring_initial_on: "{{ is_state(\n  'light.aqara_m1s_zigbee_router_192_168_0_222_ring_light',\n  'on'\n\
      ) }}"
    ring_initial_brightness: "{{ state_attr(\n  'light.aqara_m1s_zigbee_router_192_168_0_222_ring_light',\n\
      \  'brightness'\n) | int(255) }}"
    ring_initial_rgb: "{{ state_attr(\n  'light.aqara_m1s_zigbee_router_192_168_0_222_ring_light',\n \
      \ 'rgb_color'\n) or [255, 255, 255] }}"
- action: aqara_m1s_zigbee_router.play_sound
  continue_on_error: true
  data:
    host: 192.168.0.222
    path: '{{ state_attr(''button.dormitor_dormitor_mp_hub_router_192_168_0_222_play_ch_notification_031'',
      ''file_path'') }}'
    volume_percent: '{{ 10 if now().hour >= 21 or now().hour < 9 else 50 }}'
- action: light.turn_on
  continue_on_error: true
  target:
    entity_id: light.aqara_m1s_zigbee_router_192_168_0_222_ring_light
  data:
    brightness_pct: 100
    rgb_color:
    - 255
    - 0
    - 0
- delay: 00:00:02
- action: light.turn_on
  continue_on_error: true
  target:
    entity_id: light.aqara_m1s_zigbee_router_192_168_0_222_ring_light
  data:
    brightness_pct: 100
    rgb_color:
    - 0
    - 0
    - 255
- delay: 00:00:02
- action: light.turn_on
  continue_on_error: true
  target:
    entity_id: light.aqara_m1s_zigbee_router_192_168_0_222_ring_light
  data:
    brightness_pct: 100
    rgb_color:
    - 255
    - 0
    - 0
- delay: 00:00:02
- action: light.turn_on
  continue_on_error: true
  target:
    entity_id: light.aqara_m1s_zigbee_router_192_168_0_222_ring_light
  data:
    brightness_pct: 100
    rgb_color:
    - 0
    - 0
    - 255
- delay: 00:00:02
- choose:
  - conditions:
    - condition: template
      value_template: '{{ ring_initial_on }}'
    sequence:
    - action: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.aqara_m1s_zigbee_router_192_168_0_222_ring_light
      data:
        brightness: '{{ ring_initial_brightness }}'
        rgb_color:
        - '{{ ring_initial_rgb[0] | int }}'
        - '{{ ring_initial_rgb[1] | int }}'
        - '{{ ring_initial_rgb[2] | int }}'
  default:
  - action: light.turn_off
    continue_on_error: true
    target:
      entity_id: light.aqara_m1s_zigbee_router_192_168_0_222_ring_light
mode: single
max_exceeded: silent
