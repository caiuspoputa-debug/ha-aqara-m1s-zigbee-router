</usr/share/alsa/alsa.conf>
pcm.m1s_media {
    type plug
    slave {
        pcm "m1s_media_gain"
        format S32_LE
        rate 32000
        channels 1
    }
}
pcm.m1s_media_gain {
    type softvol
    slave.pcm "hw:0,0"
    control {
        name "M1S Media Volume"
        card 0
        count 1
    }
    min_dB -80.0
    max_dB 0.0
    resolution 1024
}
pcm.m1s_volume_init {
    type softvol
    slave.pcm "null"
    control {
        name "M1S Media Volume"
        card 0
        count 1
    }
    min_dB -80.0
    max_dB 0.0
    resolution 1024
}
